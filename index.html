<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0d" />
<title>Gaia Editor — Controle Remoto</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card: #1a1a1a;
    --card2: #151515;
    --border: #2a2a2a;
    --gold1: #d4af37;
    --gold2: #f5e194;
    --text: #eee;
    --muted: #999;
    --ok: #7be08a;
    --erro: #ff8080;
    --warn: #f5c96a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
  }
  body { padding-bottom: 78px; }
  a { color: var(--gold1); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 0; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px; max-width: 480px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold1), var(--gold2));
    box-shadow: 0 0 10px rgba(212,175,55,0.7);
  }
  .brand b { font-size: 15px; letter-spacing: 0.3px; }
  .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; padding: 6px 10px; border-radius: 20px; cursor: pointer;
  }
  .logout-btn:active { background: #222; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  h1 { font-size: 21px; margin: 4px 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--gold2); font-weight: 600; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }

  label { display: block; font-size: 12.5px; color: #ccc; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: #111; color: #fff; font-size: 14.5px;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold1); }
  textarea { resize: vertical; min-height: 70px; }
  input[type="file"] { padding: 9px; font-size: 13px; }
  input[type="file"]::-webkit-file-upload-button {
    background: #262626; color: #eee; border: none; border-radius: 6px;
    padding: 6px 10px; margin-right: 8px; font-size: 12.5px;
  }

  button.primary {
    width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: #111;
    font-weight: 700; font-size: 15px; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.55; }
  button.primary:active { transform: scale(0.98); }
  button.ghost {
    width: 100%; margin-top: 10px; padding: 11px; border: 1px solid var(--border);
    border-radius: 10px; background: transparent; color: #ccc; font-size: 13.5px; cursor: pointer;
  }

  .msg { margin-top: 14px; font-size: 13.5px; line-height: 1.5; }
  .msg.ok { color: var(--ok); }
  .msg.erro { color: var(--erro); }
  .msg.warn { color: var(--warn); }

  .badge {
    display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
    font-weight: 600; letter-spacing: 0.2px;
  }
  .badge.awaiting_video { background: #3a3a1a; color: #e0d27b; }
  .badge.scheduled { background: #1a2f3a; color: #7ec8e3; }
  .badge.posting { background: #3a2f1a; color: var(--warn); }
  .badge.posted { background: #1a3a22; color: var(--ok); }
  .badge.failed { background: #3a1a1a; color: var(--erro); }

  .queue-item {
    background: var(--card2); border: 1px solid var(--border); border-radius: 11px;
    padding: 13px 14px; margin-bottom: 10px;
  }
  .queue-item .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .queue-item .plat { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
  .plat.tiktok { color: #7ec8e3; }
  .plat.instagram { color: #e08ac0; }
  .queue-item .cap {
    font-size: 13.5px; color: #ddd; margin: 8px 0 6px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .queue-item .cap.empty { color: var(--muted); font-style: italic; }
  .queue-item .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .queue-item .cancel {
    background: none; border: none; color: #a55; font-size: 12px; cursor: pointer; padding: 4px 0;
  }
  .empty-state { text-align: center; padding: 34px 10px; color: var(--muted); font-size: 13.5px; }
  .empty-state .big { font-size: 34px; margin-bottom: 10px; }

  .conn-status {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    padding: 9px 12px; border-radius: 9px; margin-bottom: 14px;
  }
  .conn-status.ok { background: #10241a; color: var(--ok); }
  .conn-status.bad { background: #2a1414; color: var(--erro); }
  .conn-status .dot2 { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  .progress-wrap { margin-top: 12px; }
  .progress-track { background: #262626; border-radius: 20px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold1), var(--gold2)); width: 0%; transition: width 0.2s; }
  .progress-label { font-size: 11.5px; color: var(--muted); margin-top: 6px; text-align: center; }

  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #121212; border-top: 1px solid var(--border);
    display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    flex: 1; background: none; border: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; padding: 6px 2px; cursor: pointer;
  }
  nav.tabbar button .ic { font-size: 19px; line-height: 1; }
  nav.tabbar button.active { color: var(--gold2); }

  .view { display: none; }
  .view.active { display: block; }

  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-screen .card { width: 100%; max-width: 380px; }
  .login-logo { text-align: center; margin-bottom: 22px; }
  .login-logo .dot { width: 14px; height: 14px; margin: 0 auto 10px; }
  .login-logo h1 { margin: 0; font-size: 20px; }
  .login-logo small { color: var(--muted); font-size: 12.5px; }

  .refresh-row { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .refresh-row button {
    background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hide { display: none !important; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="view-login" class="login-screen">
  <div class="card">
    <div class="login-logo">
      <div class="dot"></div>
      <h1>Controle Remoto</h1>
      <small>Gaia Editor</small>
    </div>
    <form id="form-login">
      <label>E-mail</label>
      <input id="login-email" type="email" autocomplete="username" required />
      <label>Senha</label>
      <input id="login-password" type="password" autocomplete="current-password" required />
      <button class="primary" type="submit" id="login-btn">Entrar</button>
    </form>
    <div id="login-msg" class="msg"></div>
    <p class="sub" style="margin-top:18px; text-align:center;">Use o mesmo e-mail e senha do Gaia Editor no seu computador.</p>
  </div>
</div>

<!-- ===================== APP (logado) ===================== -->
<div id="app" class="hide">
  <header class="top">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <b>Controle Remoto</b>
        <small id="user-email-label">—</small>
      </div>
    </div>
    <button class="logout-btn" id="btn-logout">Sair</button>
  </header>

  <div class="wrap">

    <!-- ---------- FILA ---------- -->
    <section id="view-fila" class="view active">
      <div class="refresh-row">
        <button id="btn-refresh-fila"><span id="fila-refresh-ic">↻</span> atualizar</button>
      </div>
      <div id="fila-list"></div>
    </section>

    <!-- ---------- TIKTOK ---------- -->
    <section id="view-tiktok" class="view">
      <div class="card">
        <h2>Agendar no TikTok</h2>
        <div id="tiktok-conn" class="conn-status"><span class="dot2"></span><span>Verificando conexão…</span></div>
        <form id="form-tiktok">
          <label>Conta</label>
          <select id="tt-account"></select>

          <label>Vídeo</label>
          <input id="tt-video" type="file" accept="video/*" required />

          <label>Legenda</label>
          <textarea id="tt-caption" placeholder="Escreva a legenda do vídeo…"></textarea>

          <label>Privacidade</label>
          <select id="tt-privacy">
            <option value="">Padrão da conta</option>
            <option value="PUBLIC_TO_EVERYONE">Todo mundo</option>
            <option value="MUTUAL_FOLLOW_FRIENDS">Amigos (seguem um ao outro)</option>
            <option value="FOLLOWER_OF_CREATOR">Só seguidores</option>
            <option value="SELF_ONLY">Só eu</option>
          </select>

          <label>Data e hora do post</label>
          <input id="tt-when" type="datetime-local" required />

          <button class="primary" type="submit" id="tt-submit">Agendar no TikTok</button>
        </form>
        <div class="progress-wrap hide" id="tt-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="tt-progress-fill"></div></div>
          <div class="progress-label" id="tt-progress-label">Enviando vídeo…</div>
        </div>
        <div id="tt-msg" class="msg"></div>
      </div>
    </section>

    <!-- ---------- INSTAGRAM ---------- -->
    <section id="view-instagram" class="view">
      <div class="card">
        <h2>Agendar / repostar no Instagram</h2>
        <div id="ig-conn" class="conn-status"><span class="dot2"></span><span>Verificando conexão…</span></div>
        <form id="form-instagram">
          <label>Vídeo</label>
          <input id="ig-video" type="file" accept="video/*" required />

          <label>Legenda</label>
          <textarea id="ig-caption" placeholder="Escreva a legenda do Reels…"></textarea>

          <label>Data e hora do post</label>
          <input id="ig-when" type="datetime-local" required />

          <button class="primary" type="submit" id="ig-submit">Agendar no Instagram</button>
        </form>
        <div class="progress-wrap hide" id="ig-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="ig-progress-fill"></div></div>
          <div class="progress-label" id="ig-progress-label">Enviando vídeo…</div>
        </div>
        <div id="ig-msg" class="msg"></div>
      </div>
    </section>

  </div>

  <nav class="tabbar">
    <button data-view="fila" class="tab-btn active"><span class="ic">📋</span>Fila</button>
    <button data-view="tiktok" class="tab-btn"><span class="ic">🎵</span>TikTok</button>
    <button data-view="instagram" class="tab-btn"><span class="ic">📷</span>Instagram</button>
  </nav>
</div>

<script>
(function () {
  'use strict';

  var API = 'https://gaia-editor-server-production.up.railway.app';
  var STORAGE_KEY = 'gaia_remote_auth';

  // ---------------------------------------------------------------------
  // Auth / storage
  // ---------------------------------------------------------------------
  function getAuth() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; }
  }
  function setAuth(auth) { localStorage.setItem(STORAGE_KEY, JSON.stringify(auth)); }
  function clearAuth() { localStorage.removeItem(STORAGE_KEY); }

  async function api(path, opts) {
    opts = opts || {};
    var auth = getAuth();
    var headers = Object.assign({}, opts.headers || {});
    if (auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
    if (opts.json !== false && opts.body && typeof opts.body === 'string') {
      headers['Content-Type'] = 'application/json';
    }
    var resp = await fetch(API + path, Object.assign({}, opts, { headers: headers }));
    if (resp.status === 401) {
      clearAuth();
      showLogin('Sua sessão expirou. Faça login de novo.');
      throw new Error('unauthorized');
    }
    var data = null;
    try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      var err = new Error((data && data.error) || ('Erro do servidor (' + resp.status + ').'));
      throw err;
    }
    return data;
  }

  // Upload de vídeo com barra de progresso — usa XHR porque fetch() não
  // reporta progresso de envio (upload) de forma confiável em todo navegador.
  function uploadVideo(path, file, onProgress) {
    var auth = getAuth();
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', API + path);
      xhr.setRequestHeader('Authorization', 'Bearer ' + (auth && auth.token));
      xhr.setRequestHeader('Content-Type', 'video/mp4');
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(true);
        } else {
          var msg = 'Falha ao enviar o vídeo (HTTP ' + xhr.status + ').';
          try { var d = JSON.parse(xhr.responseText); if (d && d.error) msg = d.error; } catch (e) {}
          reject(new Error(msg));
        }
      };
      xhr.onerror = function () { reject(new Error('Falha de conexão ao enviar o vídeo.')); };
      xhr.send(file);
    });
  }

  // ---------------------------------------------------------------------
  // Navegação entre telas
  // ---------------------------------------------------------------------
  function showLogin(msg) {
    document.getElementById('app').classList.add('hide');
    document.getElementById('view-login').style.display = 'flex';
    if (msg) {
      var el = document.getElementById('login-msg');
      el.textContent = msg;
      el.className = 'msg warn';
    }
  }
  function showApp() {
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('app').classList.remove('hide');
    var auth = getAuth();
    document.getElementById('user-email-label').textContent = (auth && auth.email) || '';
  }

  function switchTab(name) {
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === name);
    });
    if (name === 'fila') loadFila();
    if (name === 'tiktok') loadTikTokTab();
    if (name === 'instagram') loadInstagramTab();
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.getAttribute('data-view')); });
  });

  // ---------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------
  document.getElementById('form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var btn = document.getElementById('login-btn');
    var msgEl = document.getElementById('login-msg');
    msgEl.textContent = ''; msgEl.className = 'msg';
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      var resp = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
      });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) {
        msgEl.textContent = data.error || 'Não deu pra entrar.';
        msgEl.className = 'msg erro';
        return;
      }
      setAuth({ token: data.token, email: data.email, name: data.name });
      showApp();
      switchTab('fila');
    } catch (err) {
      msgEl.textContent = 'Erro de conexão. Tenta de novo em alguns segundos.';
      msgEl.className = 'msg erro';
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });

  document.getElementById('btn-logout').addEventListener('click', function () {
    clearAuth();
    showLogin();
  });

  // ---------------------------------------------------------------------
  // Fila (TikTok agendado + Instagram agendado, combinados)
  // ---------------------------------------------------------------------
  var STATUS_LABEL = {
    awaiting_video: 'Aguardando vídeo',
    scheduled: 'Agendado',
    posting: 'Publicando…',
    posted: 'Publicado',
    failed: 'Falhou',
  };

  function fmtWhen(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  async function loadFila() {
    var listEl = document.getElementById('fila-list');
    var icEl = document.getElementById('fila-refresh-ic');
    icEl.classList.add('spin');
    listEl.innerHTML = '';
    try {
      var results = await Promise.all([
        api('/api/tiktok/scheduled').catch(function () { return []; }),
        api('/api/instagram/scheduled').catch(function () { return []; }),
      ]);
      var tk = (results[0] || []).map(function (r) { return Object.assign({ platform: 'tiktok' }, r); });
      var ig = (results[1] || []).map(function (r) { return Object.assign({ platform: 'instagram' }, r); });
      var all = tk.concat(ig).sort(function (a, b) { return new Date(a.scheduledAt) - new Date(b.scheduledAt); });

      if (!all.length) {
        listEl.innerHTML =
          '<div class="empty-state"><div class="big">🗓️</div>Nada agendado ainda.<br/>Use as abas TikTok ou Instagram pra agendar um post.</div>';
        return;
      }

      all.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'queue-item';
        var platLabel = item.platform === 'tiktok' ? 'TIKTOK' : 'INSTAGRAM';
        var platClass = item.platform === 'tiktok' ? 'tiktok' : 'instagram';
        var status = item.status || 'scheduled';
        var caption = (item.caption || '').trim();
        div.innerHTML =
          '<div class="row1">' +
            '<span class="plat ' + platClass + '">' + platLabel + '</span>' +
            '<span class="badge ' + status + '">' + (STATUS_LABEL[status] || status) + '</span>' +
          '</div>' +
          '<div class="cap' + (caption ? '' : ' empty') + '">' + (caption ? escapeHtml(caption) : 'Sem legenda') + '</div>' +
          '<div class="meta">' +
            '<span>' + fmtWhen(item.scheduledAt) + '</span>' +
            (status === 'posted' || status === 'posting' ? '' : '<button class="cancel" data-id="' + item.id + '" data-platform="' + item.platform + '">cancelar</button>') +
          '</div>' +
          (item.error ? '<div class="msg erro" style="margin-top:8px; font-size:12px;">' + escapeHtml(item.error) + '</div>' : '');
        listEl.appendChild(div);
      });

      listEl.querySelectorAll('.cancel').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var id = btn.getAttribute('data-id');
          var platform = btn.getAttribute('data-platform');
          btn.textContent = 'cancelando…';
          btn.disabled = true;
          try {
            await api('/api/' + platform + '/scheduled/' + id, { method: 'DELETE' });
            loadFila();
          } catch (e) {
            btn.textContent = 'erro, tenta de novo';
            btn.disabled = false;
          }
        });
      });
    } catch (e) {
      listEl.innerHTML = '<div class="empty-state">Não deu pra carregar a fila agora.<br/>' + escapeHtml(e.message || '') + '</div>';
    } finally {
      icEl.classList.remove('spin');
    }
  }
  document.getElementById('btn-refresh-fila').addEventListener('click', loadFila);

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------------------------------------------------------------
  // TikTok — status + agendar
  // ---------------------------------------------------------------------
  async function loadTikTokTab() {
    var connEl = document.getElementById('tiktok-conn');
    var accSel = document.getElementById('tt-account');
    connEl.className = 'conn-status';
    connEl.innerHTML = '<span class="dot2"></span><span>Verificando conexão…</span>';
    try {
      var accounts = await api('/api/tiktok/accounts');
      if (!accounts || !accounts.length) {
        connEl.className = 'conn-status bad';
        connEl.innerHTML = '<span class="dot2"></span><span>Nenhuma conta do TikTok conectada. Conecte no Gaia Editor no PC primeiro.</span>';
        accSel.innerHTML = '';
        document.getElementById('tt-submit').disabled = true;
        return;
      }
      connEl.className = 'conn-status ok';
      connEl.innerHTML = '<span class="dot2"></span><span>' + accounts.length + ' conta(s) do TikTok conectada(s).</span>';
      accSel.innerHTML = accounts.map(function (a) {
        return '<option value="' + a.accountId + '">' + escapeHtml(a.label || 'Conta TikTok') + '</option>';
      }).join('');
      document.getElementById('tt-submit').disabled = false;
    } catch (e) {
      connEl.className = 'conn-status bad';
      connEl.innerHTML = '<span class="dot2"></span><span>Não deu pra verificar a conexão agora.</span>';
    }
  }

  document.getElementById('form-tiktok').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('tt-submit');
    var msgEl = document.getElementById('tt-msg');
    var progWrap = document.getElementById('tt-progress-wrap');
    var progFill = document.getElementById('tt-progress-fill');
    var progLabel = document.getElementById('tt-progress-label');
    msgEl.textContent = ''; msgEl.className = 'msg';

    var file = document.getElementById('tt-video').files[0];
    if (!file) { msgEl.textContent = 'Escolha um vídeo.'; msgEl.className = 'msg erro'; return; }
    var accountId = document.getElementById('tt-account').value;
    var caption = document.getElementById('tt-caption').value;
    var privacyLevel = document.getElementById('tt-privacy').value || undefined;
    var whenLocal = document.getElementById('tt-when').value;
    if (!whenLocal) { msgEl.textContent = 'Escolha a data e hora.'; msgEl.className = 'msg erro'; return; }
    var scheduledAt = new Date(whenLocal).toISOString();

    btn.disabled = true; btn.textContent = 'Agendando…';
    try {
      var created = await api('/api/tiktok/schedule', {
        method: 'POST',
        body: JSON.stringify({ caption: caption, privacyLevel: privacyLevel, scheduledAt: scheduledAt, accountId: accountId }),
      });
      progWrap.classList.remove('hide');
      progLabel.textContent = 'Enviando vídeo… 0%';
      await uploadVideo('/api/tiktok/schedule/' + created.id + '/video', file, function (pct) {
        progFill.style.width = pct + '%';
        progLabel.textContent = 'Enviando vídeo… ' + pct + '%';
      });
      progWrap.classList.add('hide');
      msgEl.textContent = 'Agendado! Vai postar sozinho no TikTok na hora marcada, mesmo com o PC desligado.';
      msgEl.className = 'msg ok';
      document.getElementById('form-tiktok').reset();
      document.getElementById('tt-video').value = '';
    } catch (err) {
      progWrap.classList.add('hide');
      msgEl.textContent = err.message || 'Não deu pra agendar.';
      msgEl.className = 'msg erro';
    } finally {
      btn.disabled = false; btn.textContent = 'Agendar no TikTok';
    }
  });

  // ---------------------------------------------------------------------
  // Instagram — status + agendar
  // ---------------------------------------------------------------------
  async function loadInstagramTab() {
    var connEl = document.getElementById('ig-conn');
    connEl.className = 'conn-status';
    connEl.innerHTML = '<span class="dot2"></span><span>Verificando conexão…</span>';
    try {
      var status = await api('/api/instagram/status');
      if (!status.connected) {
        connEl.className = 'conn-status bad';
        connEl.innerHTML = '<span class="dot2"></span><span>Instagram não conectado. Conecte no Gaia Editor no PC primeiro.</span>';
        document.getElementById('ig-submit').disabled = true;
        return;
      }
      connEl.className = 'conn-status ok';
      connEl.innerHTML = '<span class="dot2"></span><span>Instagram conectado.</span>';
      document.getElementById('ig-submit').disabled = false;
    } catch (e) {
      connEl.className = 'conn-status bad';
      connEl.innerHTML = '<span class="dot2"></span><span>Não deu pra verificar a conexão agora.</span>';
    }
  }

  document.getElementById('form-instagram').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('ig-submit');
    var msgEl = document.getElementById('ig-msg');
    var progWrap = document.getElementById('ig-progress-wrap');
    var progFill = document.getElementById('ig-progress-fill');
    var progLabel = document.getElementById('ig-progress-label');
    msgEl.textContent = ''; msgEl.className = 'msg';

    var file = document.getElementById('ig-video').files[0];
    if (!file) { msgEl.textContent = 'Escolha um vídeo.'; msgEl.className = 'msg erro'; return; }
    var caption = document.getElementById('ig-caption').value;
    var whenLocal = document.getElementById('ig-when').value;
    if (!whenLocal) { msgEl.textContent = 'Escolha a data e hora.'; msgEl.className = 'msg erro'; return; }
    var scheduledAt = new Date(whenLocal).toISOString();

    btn.disabled = true; btn.textContent = 'Agendando…';
    try {
      var created = await api('/api/instagram/schedule', {
        method: 'POST',
        body: JSON.stringify({ caption: caption, scheduledAt: scheduledAt }),
      });
      progWrap.classList.remove('hide');
      progLabel.textContent = 'Enviando vídeo… 0%';
      await uploadVideo('/api/instagram/schedule/' + created.id + '/video', file, function (pct) {
        progFill.style.width = pct + '%';
        progLabel.textContent = 'Enviando vídeo… ' + pct + '%';
      });
      progWrap.classList.add('hide');
      msgEl.textContent = 'Agendado! Vai postar sozinho no Instagram na hora marcada, mesmo com o PC desligado.';
      msgEl.className = 'msg ok';
      document.getElementById('form-instagram').reset();
      document.getElementById('ig-video').value = '';
    } catch (err) {
      progWrap.classList.add('hide');
      msgEl.textContent = err.message || 'Não deu pra agendar.';
      msgEl.className = 'msg erro';
    } finally {
      btn.disabled = false; btn.textContent = 'Agendar no Instagram';
    }
  });

  // ---------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------
  var auth = getAuth();
  if (auth && auth.token) {
    showApp();
    switchTab('fila');
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
