<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#120A05" />
<title>Gaia Creator — Controle Remoto</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════
     Mesmo design system "Luxo Silencioso" do Gaia Editor no PC
     (src/styles.css) — reaproveitado aqui pro Controle Remoto mobile
     ficar visualmente da mesma família, não um app amador à parte.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    --bg: #120A05;
    --text: #F0E8DC;
    --gold: #C8A87A;
    --gold-soft: rgba(200, 168, 122, 0.6);
    --gold-line: rgba(200, 168, 122, 0.15);
    --sage: #00C896;
    --sage-soft: #8FD9A8;
    --danger: #D05848;
    --danger-soft: #E08A7A;
    --blue: #7AA0C8;
    --tiktok-tag: #69C9D0;
    --ig-tag: #E3A6C6;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --r-pill: 100px;
    --r-xl: 28px;
    --r-lg: 20px;
    --r: 14px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  body { padding-bottom: 84px; position: relative; }

  /* halo ambiente sutil, mesma ideia do #ambient-canvas do desktop */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(200,168,122,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 100% 100%, rgba(200,168,122,0.05) 0%, transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 16px; }

  a { color: var(--gold); }

  /* ── Cabeçalho / logo (mesmo padrão do .logo do sidebar desktop) ───── */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 18px 16px 14px; max-width: 480px; margin: 0 auto;
    position: relative; z-index: 1;
    border-bottom: 1px solid rgba(200, 168, 122, 0.08);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 42px; height: 42px; flex-shrink: 0; border-radius: 14px;
    background: linear-gradient(135deg, rgba(200,168,122,0.22), rgba(200,168,122,0.06));
    border: 1px solid rgba(200, 168, 122, 0.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; color: var(--gold);
  }
  .brand-text { display: flex; flex-direction: column; gap: 1px; }
  .brand-name { font-family: var(--font-serif); font-size: 14.5px; color: #E8D0A0; letter-spacing: 0.3px; }
  .brand-sub { font-size: 8px; font-weight: 700; color: rgba(200,168,122,0.45); letter-spacing: 1.6px; text-transform: uppercase; }
  .user-email { font-size: 9.5px; color: rgba(240,232,220,0.35); margin-top: 2px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .logout-btn {
    background: transparent; border: 1px solid rgba(200,168,122,0.2); color: rgba(240,232,220,0.55);
    font-size: 11px; font-family: var(--font-sans); padding: 7px 14px; border-radius: var(--r-pill); cursor: pointer;
    transition: all 0.2s var(--ease); white-space: nowrap;
  }
  .logout-btn:active { background: rgba(200,168,122,0.08); border-color: rgba(200,168,122,0.35); color: rgba(240,232,220,0.85); }

  /* ── Glass card (equivalente ao .glass-champagne do desktop) ───────── */
  .card {
    background: linear-gradient(135deg, rgba(200,168,122,0.08) 0%, rgba(200,168,122,0.03) 100%);
    backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid rgba(200,168,122,0.18);
    border-radius: var(--r-xl);
    box-shadow: 0 24px 60px -24px rgba(100,60,10,0.4), inset 0 1px 0 rgba(200,168,122,0.15);
    padding: 22px; margin-bottom: 16px;
  }
  h1.title { font-family: var(--font-serif); font-size: 22px; font-weight: normal; color: var(--text); letter-spacing: -0.01em; }
  h2.eyebrow {
    font-family: var(--font-sans); font-size: 9.5px; font-weight: 700; letter-spacing: 1.8px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 14px;
  }
  p.body-text { color: rgba(240,232,220,0.55); font-size: 12.5px; line-height: 1.6; }

  label.field-label {
    display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px;
    color: rgba(200,168,122,0.6); text-transform: uppercase; margin: 16px 0 7px;
  }
  label.field-label:first-of-type { margin-top: 0; }

  input.field-input, textarea.field-input, select.field-input {
    width: 100%; padding: 12px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(200,168,122,0.15);
    border-radius: var(--r-sm);
    color: var(--text); font-size: 14px; font-family: var(--font-sans);
    outline: none; transition: border-color 0.2s var(--ease);
  }
  input.field-input:focus, textarea.field-input:focus, select.field-input:focus { border-color: rgba(200,168,122,0.45); }
  input.field-input::placeholder, textarea.field-input::placeholder { color: rgba(200,168,122,0.32); }
  textarea.field-input { resize: vertical; min-height: 76px; font-family: var(--font-sans); }
  select.field-input { cursor: pointer; }
  select.field-input option { background: #1A0E07; color: var(--text); }
  input[type="file"].field-input { padding: 10px; font-size: 12.5px; }
  input[type="file"].field-input::-webkit-file-upload-button {
    background: rgba(200,168,122,0.12); color: #E8D0A0; border: 1px solid rgba(200,168,122,0.2);
    border-radius: 7px; padding: 6px 12px; margin-right: 10px; font-size: 11.5px; cursor: pointer;
  }

  /* ── Botões (mesmo padrão .btn / .btn-primary / .btn-ghost) ─────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px 24px; border: none; border-radius: var(--r-pill);
    font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: all 0.2s var(--ease); margin-top: 20px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.4); }
  .btn-primary {
    background: linear-gradient(135deg, #C8A87A, #A08050); color: #1A0A02;
    box-shadow: 0 4px 20px -4px rgba(200,168,122,0.5);
  }
  .btn-ghost {
    background: transparent; border: 1px solid rgba(200,168,122,0.2); color: rgba(240,232,220,0.6);
    margin-top: 10px;
  }

  .msg { margin-top: 14px; font-size: 12.5px; line-height: 1.55; }
  .msg.ok { color: var(--sage-soft); }
  .msg.erro { color: var(--danger-soft); }
  .msg.warn { color: #E8D0A0; }

  /* ── Status dot (mesmo padrão .status-dot / .tiktok-account-dot) ────── */
  .conn-status {
    display: flex; align-items: center; gap: 9px; font-size: 12px;
    padding: 11px 14px; border-radius: var(--r-sm); margin-bottom: 16px;
    border: 1px solid rgba(200,168,122,0.1); background: rgba(200,168,122,0.03);
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .conn-dot.ok { background: var(--sage-soft); color: var(--sage-soft); animation: pulse-dot 2s ease-in-out infinite; }
  .conn-dot.bad { background: var(--danger-soft); color: var(--danger-soft); }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .conn-status span.txt { color: rgba(240,232,220,0.7); }
  .conn-status.ok span.txt { color: var(--sage-soft); }
  .conn-status.bad span.txt { color: var(--danger-soft); }

  /* ── Fila / itens agendados (mesmo padrão .scheduled-item) ───────────── */
  .refresh-row { display: flex; justify-content: flex-end; align-items: center; margin: 16px 0 10px; }
  .refresh-btn {
    background: none; border: none; color: rgba(200,168,122,0.55); font-size: 11.5px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; font-family: var(--font-sans);
  }
  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .queue-item {
    background: rgba(0,0,0,0.22); border: 1px solid rgba(200,168,122,0.12);
    border-radius: var(--r); padding: 15px 16px; margin-bottom: 11px;
    animation: card-in 0.35s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .queue-item .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .plat-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    padding: 2px 9px; border-radius: var(--r-pill);
  }
  .plat-tag.tiktok { color: var(--tiktok-tag); background: rgba(105,201,208,0.08); border: 1px solid rgba(105,201,208,0.22); }
  .plat-tag.instagram { color: var(--ig-tag); background: rgba(227,166,198,0.08); border: 1px solid rgba(227,166,198,0.22); }
  .status-badge { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .queue-item .cap {
    font-family: var(--font-serif); font-size: 14px; color: var(--text); margin: 9px 0 6px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .queue-item .cap.empty { color: rgba(240,232,220,0.35); font-style: italic; }
  .queue-item .meta { font-size: 11px; color: rgba(200,168,122,0.55); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .queue-item .cancel {
    background: none; border: none; color: rgba(208,88,72,0.75); font-size: 11px; cursor: pointer; padding: 4px 0;
    font-family: var(--font-sans);
  }
  .queue-item .err { font-size: 11px; color: var(--danger-soft); margin-top: 8px; }

  .empty-state {
    text-align: center; padding: 44px 16px; color: rgba(240,232,220,0.4); font-size: 13px; line-height: 1.6;
  }
  .empty-state .big { font-size: 30px; margin-bottom: 12px; color: rgba(200,168,122,0.35); }

  .progress-wrap { margin-top: 14px; }
  .progress-track { background: rgba(0,0,0,0.35); border-radius: var(--r-pill); height: 7px; overflow: hidden; border: 1px solid rgba(200,168,122,0.1); }
  .progress-fill { height: 100%; background: linear-gradient(135deg, #C8A87A, #A08050); width: 0%; transition: width 0.2s; }
  .progress-label { font-size: 10.5px; color: rgba(200,168,122,0.55); margin-top: 7px; text-align: center; }

  /* ── Barra inferior de navegação (equivalente mobile da .sidebar) ───── */
  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(8, 5, 2, 0.92);
    backdrop-filter: blur(30px) saturate(120%); -webkit-backdrop-filter: blur(30px) saturate(120%);
    border-top: 1px solid rgba(200,168,122,0.1);
    display: flex; padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
    gap: 6px;
  }
  nav.tabbar .tab-btn {
    flex: 1; background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    color: rgba(240,232,220,0.4); font-family: var(--font-sans);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; padding: 8px 4px; cursor: pointer; transition: all 0.2s var(--ease);
  }
  nav.tabbar .tab-btn .ic { font-size: 17px; line-height: 1; color: rgba(200,168,122,0.4); transition: color 0.2s var(--ease); }
  nav.tabbar .tab-btn.active {
    background: rgba(200,168,122,0.1); color: #E8D0A0; border-color: rgba(200,168,122,0.2); font-weight: 600;
  }
  nav.tabbar .tab-btn.active .ic { color: var(--gold); }

  .view { display: none; }
  .view.active { display: block; }

  /* ── Tela de login ──────────────────────────────────────────────────── */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 26px; position: relative; z-index: 1; }
  .login-screen .card { width: 100%; max-width: 380px; margin-bottom: 0; }
  .login-logo { text-align: center; margin-bottom: 26px; }
  .login-logo .logo-mark { width: 56px; height: 56px; font-size: 26px; margin: 0 auto 14px; border-radius: var(--r-lg); }
  .login-logo h1 { font-family: var(--font-serif); font-size: 21px; font-weight: normal; color: var(--text); }
  .login-logo .login-sub { font-size: 8.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(200,168,122,0.45); margin-top: 5px; }

  .hide { display: none !important; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="view-login" class="login-screen">
  <div class="card">
    <div class="login-logo">
      <div class="logo-mark">✦</div>
      <h1>Controle Remoto</h1>
      <div class="login-sub">Gaia Creator</div>
    </div>
    <form id="form-login">
      <label class="field-label">E-mail</label>
      <input class="field-input" id="login-email" type="email" autocomplete="username" required />
      <label class="field-label">Senha</label>
      <input class="field-input" id="login-password" type="password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit" id="login-btn">Entrar</button>
    </form>
    <div id="login-msg" class="msg"></div>
    <p class="body-text" style="margin-top:18px; text-align:center;">Use o mesmo e-mail e senha do Gaia Creator no seu computador.</p>
  </div>
</div>

<!-- ===================== APP (logado) ===================== -->
<div id="app" class="hide">
  <header class="top">
    <div class="brand">
      <div class="logo-mark">✦</div>
      <div class="brand-text">
        <span class="brand-name">Gaia Creator</span>
        <span class="brand-sub">Controle Remoto</span>
        <span class="user-email" id="user-email-label"></span>
      </div>
    </div>
    <button class="logout-btn" id="btn-logout">Sair</button>
  </header>

  <div class="wrap">

    <!-- ---------- FILA ---------- -->
    <section id="view-fila" class="view active">
      <div class="refresh-row">
        <button class="refresh-btn" id="btn-refresh-fila"><span id="fila-refresh-ic">↻</span> atualizar</button>
      </div>
      <div id="fila-list"></div>
    </section>

    <!-- ---------- TIKTOK ---------- -->
    <section id="view-tiktok" class="view">
      <div class="card">
        <h2 class="eyebrow">Agendar no TikTok</h2>
        <div id="tiktok-conn" class="conn-status"><span class="conn-dot"></span><span class="txt">Verificando conexão…</span></div>
        <form id="form-tiktok">
          <label class="field-label">Conta</label>
          <select class="field-input" id="tt-account"></select>

          <label class="field-label">Vídeo</label>
          <input class="field-input" id="tt-video" type="file" accept="video/*" required />

          <label class="field-label">Legenda</label>
          <textarea class="field-input" id="tt-caption" placeholder="Escreva a legenda do vídeo…"></textarea>

          <label class="field-label">Privacidade</label>
          <select class="field-input" id="tt-privacy">
            <option value="">Padrão da conta</option>
            <option value="PUBLIC_TO_EVERYONE">Todo mundo</option>
            <option value="MUTUAL_FOLLOW_FRIENDS">Amigos (seguem um ao outro)</option>
            <option value="FOLLOWER_OF_CREATOR">Só seguidores</option>
            <option value="SELF_ONLY">Só eu</option>
          </select>

          <label class="field-label">Data e hora do post</label>
          <input class="field-input" id="tt-when" type="datetime-local" required />

          <button class="btn btn-primary" type="submit" id="tt-submit">Agendar no TikTok</button>
        </form>
        <div class="progress-wrap hide" id="tt-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="tt-progress-fill"></div></div>
          <div class="progress-label" id="tt-progress-label">Enviando vídeo…</div>
        </div>
        <div id="tt-msg" class="msg"></div>
      </div>
    </section>

    <!-- ---------- INSTAGRAM ---------- -->
    <section id="view-instagram" class="view">
      <div class="card">
        <h2 class="eyebrow">Agendar / repostar no Instagram</h2>
        <div id="ig-conn" class="conn-status"><span class="conn-dot"></span><span class="txt">Verificando conexão…</span></div>
        <form id="form-instagram">
          <label class="field-label">Vídeo</label>
          <input class="field-input" id="ig-video" type="file" accept="video/*" required />

          <label class="field-label">Legenda</label>
          <textarea class="field-input" id="ig-caption" placeholder="Escreva a legenda do Reels…"></textarea>

          <label class="field-label">Data e hora do post</label>
          <input class="field-input" id="ig-when" type="datetime-local" required />

          <button class="btn btn-primary" type="submit" id="ig-submit">Agendar no Instagram</button>
        </form>
        <div class="progress-wrap hide" id="ig-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="ig-progress-fill"></div></div>
          <div class="progress-label" id="ig-progress-label">Enviando vídeo…</div>
        </div>
        <div id="ig-msg" class="msg"></div>
      </div>
    </section>

  </div>

  <nav class="tabbar">
    <button data-view="fila" class="tab-btn active"><span class="ic">⊟</span>Fila</button>
    <button data-view="tiktok" class="tab-btn"><span class="ic">◷</span>TikTok</button>
    <button data-view="instagram" class="tab-btn"><span class="ic">⟳</span>Instagram</button>
  </nav>
</div>

<script>
(function () {
  'use strict';

  var API = 'https://gaia-editor-server-production.up.railway.app';
  var STORAGE_KEY = 'gaia_remote_auth';

  // ---------------------------------------------------------------------
  // Auth / storage
  // ---------------------------------------------------------------------
  function getAuth() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; }
  }
  function setAuth(auth) { localStorage.setItem(STORAGE_KEY, JSON.stringify(auth)); }
  function clearAuth() { localStorage.removeItem(STORAGE_KEY); }

  async function api(path, opts) {
    opts = opts || {};
    var auth = getAuth();
    var headers = Object.assign({}, opts.headers || {});
    if (auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
    if (opts.json !== false && opts.body && typeof opts.body === 'string') {
      headers['Content-Type'] = 'application/json';
    }
    var resp = await fetch(API + path, Object.assign({}, opts, { headers: headers }));
    if (resp.status === 401) {
      clearAuth();
      showLogin('Sua sessão expirou. Faça login de novo.');
      throw new Error('unauthorized');
    }
    var data = null;
    try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      var err = new Error((data && data.error) || ('Erro do servidor (' + resp.status + ').'));
      throw err;
    }
    return data;
  }

  // Upload de vídeo com barra de progresso — usa XHR porque fetch() não
  // reporta progresso de envio (upload) de forma confiável em todo navegador.
  function uploadVideo(path, file, onProgress) {
    var auth = getAuth();
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', API + path);
      xhr.setRequestHeader('Authorization', 'Bearer ' + (auth && auth.token));
      xhr.setRequestHeader('Content-Type', 'video/mp4');
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(true);
        } else {
          var msg = 'Falha ao enviar o vídeo (HTTP ' + xhr.status + ').';
          try { var d = JSON.parse(xhr.responseText); if (d && d.error) msg = d.error; } catch (e) {}
          reject(new Error(msg));
        }
      };
      xhr.onerror = function () { reject(new Error('Falha de conexão ao enviar o vídeo.')); };
      xhr.send(file);
    });
  }

  // ---------------------------------------------------------------------
  // Navegação entre telas
  // ---------------------------------------------------------------------
  function showLogin(msg) {
    document.getElementById('app').classList.add('hide');
    document.getElementById('view-login').style.display = 'flex';
    if (msg) {
      var el = document.getElementById('login-msg');
      el.textContent = msg;
      el.className = 'msg warn';
    }
  }
  function showApp() {
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('app').classList.remove('hide');
    var auth = getAuth();
    document.getElementById('user-email-label').textContent = (auth && auth.email) || '';
  }

  function switchTab(name) {
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === name);
    });
    if (name === 'fila') loadFila();
    if (name === 'tiktok') loadTikTokTab();
    if (name === 'instagram') loadInstagramTab();
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.getAttribute('data-view')); });
  });

  // ---------------------------------------------------------------------
  // Login
  // ---------------------------------------------------------------------
  document.getElementById('form-login').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var btn = document.getElementById('login-btn');
    var msgEl = document.getElementById('login-msg');
    msgEl.textContent = ''; msgEl.className = 'msg';
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      var resp = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
      });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) {
        msgEl.textContent = data.error || 'Não deu pra entrar.';
        msgEl.className = 'msg erro';
        return;
      }
      setAuth({ token: data.token, email: data.email, name: data.name });
      showApp();
      switchTab('fila');
    } catch (err) {
      msgEl.textContent = 'Erro de conexão. Tenta de novo em alguns segundos.';
      msgEl.className = 'msg erro';
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });

  document.getElementById('btn-logout').addEventListener('click', function () {
    clearAuth();
    showLogin();
  });

  // ---------------------------------------------------------------------
  // Fila (TikTok agendado + Instagram agendado, combinados) — mesmos
  // rótulos e cores do SCHEDULED_STATUS_LABEL do renderer.js do desktop,
  // pra ficar consistente entre as duas telas.
  // ---------------------------------------------------------------------
  var STATUS_LABEL = {
    awaiting_video: { label: 'Enviando vídeo…', color: '#C8A87A' },
    scheduled:      { label: 'Agendado',        color: '#C8A87A' },
    posting:        { label: 'Publicando agora…', color: '#7AA0C8' },
    posted:         { label: 'Publicado ✓',      color: '#6FBF73' },
    failed:         { label: 'Falhou',           color: '#D05848' },
  };

  function fmtWhen(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  async function loadFila() {
    var listEl = document.getElementById('fila-list');
    var icEl = document.getElementById('fila-refresh-ic');
    icEl.classList.add('spin');
    listEl.innerHTML = '';
    try {
      var results = await Promise.all([
        api('/api/tiktok/scheduled').catch(function () { return []; }),
        api('/api/instagram/scheduled').catch(function () { return []; }),
      ]);
      var tk = (results[0] || []).map(function (r) { return Object.assign({ platform: 'tiktok' }, r); });
      var ig = (results[1] || []).map(function (r) { return Object.assign({ platform: 'instagram' }, r); });
      var all = tk.concat(ig).sort(function (a, b) { return new Date(a.scheduledAt) - new Date(b.scheduledAt); });

      if (!all.length) {
        listEl.innerHTML =
          '<div class="empty-state"><div class="big">✦</div>Nada agendado ainda.<br/>Use as abas TikTok ou Instagram pra agendar um post.</div>';
        return;
      }

      all.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'queue-item';
        var platLabel = item.platform === 'tiktok' ? 'TIKTOK' : 'INSTAGRAM';
        var platClass = item.platform === 'tiktok' ? 'tiktok' : 'instagram';
        var status = item.status || 'scheduled';
        var st = STATUS_LABEL[status] || { label: status, color: '#C8A87A' };
        var caption = (item.caption || '').trim();
        div.innerHTML =
          '<div class="row1">' +
            '<span class="plat-tag ' + platClass + '">' + platLabel + '</span>' +
            '<span class="status-badge" style="color:' + st.color + '">' + st.label + '</span>' +
          '</div>' +
          '<div class="cap' + (caption ? '' : ' empty') + '">' + (caption ? escapeHtml(caption) : 'Sem legenda') + '</div>' +
          '<div class="meta">' +
            '<span>' + fmtWhen(item.scheduledAt) + '</span>' +
            (status === 'posted' || status === 'posting' ? '' : '<button class="cancel" data-id="' + item.id + '" data-platform="' + item.platform + '">✕ cancelar</button>') +
          '</div>' +
          (item.error ? '<div class="err">' + escapeHtml(item.error) + '</div>' : '');
        listEl.appendChild(div);
      });

      listEl.querySelectorAll('.cancel').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var id = btn.getAttribute('data-id');
          var platform = btn.getAttribute('data-platform');
          btn.textContent = 'cancelando…';
          btn.disabled = true;
          try {
            await api('/api/' + platform + '/scheduled/' + id, { method: 'DELETE' });
            loadFila();
          } catch (e) {
            btn.textContent = 'erro, tenta de novo';
            btn.disabled = false;
          }
        });
      });
    } catch (e) {
      listEl.innerHTML = '<div class="empty-state">Não deu pra carregar a fila agora.<br/>' + escapeHtml(e.message || '') + '</div>';
    } finally {
      icEl.classList.remove('spin');
    }
  }
  document.getElementById('btn-refresh-fila').addEventListener('click', loadFila);

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------------------------------------------------------------------
  // TikTok — status + agendar
  // ---------------------------------------------------------------------
  async function loadTikTokTab() {
    var connEl = document.getElementById('tiktok-conn');
    var accSel = document.getElementById('tt-account');
    connEl.className = 'conn-status';
    connEl.innerHTML = '<span class="conn-dot"></span><span class="txt">Verificando conexão…</span>';
    try {
      var accounts = await api('/api/tiktok/accounts');
      if (!accounts || !accounts.length) {
        connEl.className = 'conn-status bad';
        connEl.innerHTML = '<span class="conn-dot bad"></span><span class="txt">Nenhuma conta do TikTok conectada. Conecte no Gaia Creator no PC primeiro.</span>';
        accSel.innerHTML = '';
        document.getElementById('tt-submit').disabled = true;
        return;
      }
      connEl.className = 'conn-status ok';
      connEl.innerHTML = '<span class="conn-dot ok"></span><span class="txt">' + accounts.length + ' conta(s) do TikTok conectada(s).</span>';
      accSel.innerHTML = accounts.map(function (a) {
        return '<option value="' + a.accountId + '">' + escapeHtml(a.label || 'Conta TikTok') + '</option>';
      }).join('');
      document.getElementById('tt-submit').disabled = false;
    } catch (e) {
      connEl.className = 'conn-status bad';
      connEl.innerHTML = '<span class="conn-dot bad"></span><span class="txt">Não deu pra verificar a conexão agora.</span>';
    }
  }

  document.getElementById('form-tiktok').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('tt-submit');
    var msgEl = document.getElementById('tt-msg');
    var progWrap = document.getElementById('tt-progress-wrap');
    var progFill = document.getElementById('tt-progress-fill');
    var progLabel = document.getElementById('tt-progress-label');
    msgEl.textContent = ''; msgEl.className = 'msg';

    var file = document.getElementById('tt-video').files[0];
    if (!file) { msgEl.textContent = 'Escolha um vídeo.'; msgEl.className = 'msg erro'; return; }
    var accountId = document.getElementById('tt-account').value;
    var caption = document.getElementById('tt-caption').value;
    var privacyLevel = document.getElementById('tt-privacy').value || undefined;
    var whenLocal = document.getElementById('tt-when').value;
    if (!whenLocal) { msgEl.textContent = 'Escolha a data e hora.'; msgEl.className = 'msg erro'; return; }
    var scheduledAt = new Date(whenLocal).toISOString();

    btn.disabled = true; btn.textContent = 'Agendando…';
    try {
      var created = await api('/api/tiktok/schedule', {
        method: 'POST',
        body: JSON.stringify({ caption: caption, privacyLevel: privacyLevel, scheduledAt: scheduledAt, accountId: accountId }),
      });
      progWrap.classList.remove('hide');
      progLabel.textContent = 'Enviando vídeo… 0%';
      await uploadVideo('/api/tiktok/schedule/' + created.id + '/video', file, function (pct) {
        progFill.style.width = pct + '%';
        progLabel.textContent = 'Enviando vídeo… ' + pct + '%';
      });
      progWrap.classList.add('hide');
      msgEl.textContent = 'Agendado! Vai postar sozinho no TikTok na hora marcada, mesmo com o PC desligado.';
      msgEl.className = 'msg ok';
      document.getElementById('form-tiktok').reset();
      document.getElementById('tt-video').value = '';
    } catch (err) {
      progWrap.classList.add('hide');
      msgEl.textContent = err.message || 'Não deu pra agendar.';
      msgEl.className = 'msg erro';
    } finally {
      btn.disabled = false; btn.textContent = 'Agendar no TikTok';
    }
  });

  // ---------------------------------------------------------------------
  // Instagram — status + agendar
  // ---------------------------------------------------------------------
  async function loadInstagramTab() {
    var connEl = document.getElementById('ig-conn');
    connEl.className = 'conn-status';
    connEl.innerHTML = '<span class="conn-dot"></span><span class="txt">Verificando conexão…</span>';
    try {
      var status = await api('/api/instagram/status');
      if (!status.connected) {
        connEl.className = 'conn-status bad';
        connEl.innerHTML = '<span class="conn-dot bad"></span><span class="txt">Instagram não conectado. Conecte no Gaia Creator no PC primeiro.</span>';
        document.getElementById('ig-submit').disabled = true;
        return;
      }
      connEl.className = 'conn-status ok';
      connEl.innerHTML = '<span class="conn-dot ok"></span><span class="txt">Instagram conectado.</span>';
      document.getElementById('ig-submit').disabled = false;
    } catch (e) {
      connEl.className = 'conn-status bad';
      connEl.innerHTML = '<span class="conn-dot bad"></span><span class="txt">Não deu pra verificar a conexão agora.</span>';
    }
  }

  document.getElementById('form-instagram').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('ig-submit');
    var msgEl = document.getElementById('ig-msg');
    var progWrap = document.getElementById('ig-progress-wrap');
    var progFill = document.getElementById('ig-progress-fill');
    var progLabel = document.getElementById('ig-progress-label');
    msgEl.textContent = ''; msgEl.className = 'msg';

    var file = document.getElementById('ig-video').files[0];
    if (!file) { msgEl.textContent = 'Escolha um vídeo.'; msgEl.className = 'msg erro'; return; }
    var caption = document.getElementById('ig-caption').value;
    var whenLocal = document.getElementById('ig-when').value;
    if (!whenLocal) { msgEl.textContent = 'Escolha a data e hora.'; msgEl.className = 'msg erro'; return; }
    var scheduledAt = new Date(whenLocal).toISOString();

    btn.disabled = true; btn.textContent = 'Agendando…';
    try {
      var created = await api('/api/instagram/schedule', {
        method: 'POST',
        body: JSON.stringify({ caption: caption, scheduledAt: scheduledAt }),
      });
      progWrap.classList.remove('hide');
      progLabel.textContent = 'Enviando vídeo… 0%';
      await uploadVideo('/api/instagram/schedule/' + created.id + '/video', file, function (pct) {
        progFill.style.width = pct + '%';
        progLabel.textContent = 'Enviando vídeo… ' + pct + '%';
      });
      progWrap.classList.add('hide');
      msgEl.textContent = 'Agendado! Vai postar sozinho no Instagram na hora marcada, mesmo com o PC desligado.';
      msgEl.className = 'msg ok';
      document.getElementById('form-instagram').reset();
      document.getElementById('ig-video').value = '';
    } catch (err) {
      progWrap.classList.add('hide');
      msgEl.textContent = err.message || 'Não deu pra agendar.';
      msgEl.className = 'msg erro';
    } finally {
      btn.disabled = false; btn.textContent = 'Agendar no Instagram';
    }
  });

  // ---------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------
  var auth = getAuth();
  if (auth && auth.token) {
    showApp();
    switchTab('fila');
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
